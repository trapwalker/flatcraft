<!DOCTYPE html>
<html >
  <head>
    <meta charset="UTF-8">
    <!-- Without this, mobile browsers lay the page out against a fake desktop-width
         viewport (~980px) and zoom-to-fit, instead of the real screen size. Combined
         with #workfield's height:100%, that's enough to make the map render blank or
         collapse to zero height on mobile Safari/Chrome — see css/style.css's html/body
         rule for the other half of the fix. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smooth map</title>
        <link rel="stylesheet" href="css/style.css">
  </head>

  <body>

    <div id="workfield">
    </div>

    <!-- DEMO-3 (minimal slice): visible tile-source attribution, required by OSM/CyclOSM/
         OpenTopoMap/ESRI's ToU. Text itself is filled in by index.ts from src/layers.ts's
         ATTRIBUTIONS, so it's defined once, next to the layers themselves — this is just the
         mount point. Not styled beyond "present and readable" — this is a testbed, not a public
         deploy yet. -->
    <div id="attribution" style="position:absolute; left:0; bottom:0; z-index:1000; font:11px sans-serif; background:rgba(255,255,255,0.7); padding:2px 6px; color:#000;"></div>

    <!-- Classic (non-module) scripts, in load order: these set up globals/polyfills that the
         ES module entry point below relies on without importing (Math.log2 polyfill, the
         vendored dat.gui UMD global, and the generated xkcd tile data blob — see
         src/types/dat-gui.d.ts and src/types/tiles-data.d.ts for their ambient typings).
         Classic scripts always finish running before a deferred `type="module"` script starts,
         so load order between the two groups doesn't matter, only within each group. -->
    <script src="js/crossbrowser_patch.js"></script>
    <script src='js/dat.gui.min.js'></script>
    <script src="js/full_xkcd_ts_data.js"></script>

    <!-- Everything else is a real ES module now (see BACKLOG.md, AFF-3) — index.js imports the
         whole dependency graph (map.js, layers.js, etc.) itself, so it's the only script tag
         needed here. -->
    <script type="module" src="js/index.js"></script>
  </body>
</html>
